services:
  - type: web
    name: lastic-downloader
    runtime: python
    rootDir: "Flask app"
    buildCommand: |
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      pip install yt-dlp
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: FLASK_ENV
        value: production
    healthCheckPath: /
    disk:
      name: downloads
      mountPath: /tmp/downloads
      sizeGB: 1
