name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build Android APK'
        required: false
        default: 'true'

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip git zip unzip openjdk-11-jdk python3-venv libncurses5

      - name: Install buildozer and Cython
        run: |
          pip3 install --upgrade pip
          pip3 install buildozer==1.6.0 Cython==0.29.37

      - name: Build APK
        run: |
          buildozer -v android debug 2>&1 || echo "BUILD_FAILED"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: |
            bin/*.apk
            .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/-*.apk
          if-no-files-found: warn
